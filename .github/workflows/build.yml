name: Build — Windows & macOS

# アーティファクトストレージを使わず、直接 GitHub Release へアップロードする方式。
# workflow_dispatch: "Dev Build (Latest)" プレリリースとして dev-latest タグに上書き保存
# タグ push (v*):    バージョン付き正式リリースとして作成

on:
  push:
    tags:
      - 'v*'          # v0.1.0 などのタグ push でリリースビルド
  workflow_dispatch:  # GitHub 画面から手動実行も可能

jobs:
  # ──────────────────────────────────────────────────────────────
  # Windows ビルド
  # ──────────────────────────────────────────────────────────────
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify tag matches app version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          VER=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' youtube_dl/version.py)
          if [ "$GITHUB_REF_NAME" != "v$VER" ]; then
            echo "::error::タグ $GITHUB_REF_NAME が youtube_dl/version.py の v$VER と一致しません"
            exit 1
          fi

      - name: Install PyInstaller (ensure it's always available)
        working-directory: youtube_dl
        run: python -m pip install pyinstaller

      - name: Install PyTorch (CPU, Windows)
        working-directory: youtube_dl
        run: python -m pip install torch==2.5.1 torchaudio==2.5.1 --index-url https://download.pytorch.org/whl/cpu

      - name: Install demucs
        working-directory: youtube_dl
        run: python -m pip install demucs

      - name: Install remaining packages
        working-directory: youtube_dl
        run: python -m pip install Pillow "yt-dlp[default]" PySide6 pydub soundfile

      - name: Download ffmpeg (Windows)
        working-directory: youtube_dl
        shell: pwsh
        run: |
          $FfmpegDir = "ffmpeg"
          New-Item -ItemType Directory -Force -Path $FfmpegDir | Out-Null
          $ZipUrl  = 'https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip'
          $ZipPath = Join-Path $env:TEMP 'ffmpeg_dl.zip'
          Invoke-WebRequest -Uri $ZipUrl -OutFile $ZipPath -UseBasicParsing
          $ExtractDir = Join-Path $env:TEMP 'ffmpeg_extract'
          Expand-Archive -Path $ZipPath -DestinationPath $ExtractDir
          $BinDir = Get-ChildItem -Path $ExtractDir -Recurse -Filter 'ffmpeg.exe' |
                    Select-Object -First 1 | ForEach-Object { $_.DirectoryName }
          Copy-Item "$BinDir\ffmpeg.exe"  $FfmpegDir
          Copy-Item "$BinDir\ffprobe.exe" $FfmpegDir

      - name: Build with PyInstaller
        working-directory: youtube_dl
        run: pyinstaller youtube_dl.spec --noconfirm

      - name: Copy plugin.json into dist
        shell: pwsh
        run: Copy-Item plugin.json youtube_dl/dist/YoutubeAudioDownloader/plugin.json

      - name: Zip Windows build
        working-directory: youtube_dl/dist
        shell: pwsh
        # 中身をフォルダ直下に展開される形で zip 化する（setup.ps1 / アップデーターと整合）
        run: Compress-Archive -Path YoutubeAudioDownloader\* -DestinationPath YoutubeAudioDownloader-Windows.zip

      - name: Upload to GitHub Release (Windows)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'dev-latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'Dev Build (Latest)' }}
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/') }}
          files: youtube_dl/dist/YoutubeAudioDownloader-Windows.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ──────────────────────────────────────────────────────────────
  # macOS ビルド
  # ──────────────────────────────────────────────────────────────
  build-macos:
    runs-on: macos-latest   # Apple Silicon (arm64) ランナー
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify tag matches app version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          VER=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' youtube_dl/version.py)
          if [ "$GITHUB_REF_NAME" != "v$VER" ]; then
            echo "::error::タグ $GITHUB_REF_NAME が youtube_dl/version.py の v$VER と一致しません"
            exit 1
          fi

      - name: Install PyInstaller
        working-directory: youtube_dl
        run: pip install pyinstaller

      - name: Install torch + demucs
        working-directory: youtube_dl
        run: pip install torch==2.5.1 torchaudio==2.5.1 demucs

      - name: Install remaining packages
        working-directory: youtube_dl
        run: pip install Pillow "yt-dlp[default]" PySide6 pydub soundfile

      - name: Install ffmpeg static binary (macOS)
        working-directory: youtube_dl
        run: |
          mkdir -p ffmpeg_mac
          ARCH=$(uname -m)
          echo "Architecture: $ARCH"
          if [ "$ARCH" = "arm64" ]; then
            # Apple Silicon: Homebrew の静的バイナリを使用
            brew install ffmpeg
            cp "$(brew --prefix)/bin/ffmpeg"  ffmpeg_mac/ffmpeg
            cp "$(brew --prefix)/bin/ffprobe" ffmpeg_mac/ffprobe
          else
            # Intel: evermeet.cx の静的ビルドを使用（dylib 依存なし）
            curl -L "https://evermeet.cx/ffmpeg/getrelease/ffmpeg/zip"  -o /tmp/ffmpeg.zip
            curl -L "https://evermeet.cx/ffmpeg/getrelease/ffprobe/zip" -o /tmp/ffprobe.zip
            unzip -o /tmp/ffmpeg.zip  -d ffmpeg_mac/
            unzip -o /tmp/ffprobe.zip -d ffmpeg_mac/
          fi
          chmod +x ffmpeg_mac/ffmpeg ffmpeg_mac/ffprobe
          # バイナリ確認
          file ffmpeg_mac/ffmpeg

      - name: Build with PyInstaller
        working-directory: youtube_dl
        run: pyinstaller youtube_dl_mac.spec --noconfirm

      - name: Remove quarantine attribute
        working-directory: youtube_dl
        run: xattr -cr dist/YoutubeAudioDownloader.app || true

      - name: Zip .app bundle
        working-directory: youtube_dl/dist
        run: zip -r YoutubeAudioDownloader-macOS.zip YoutubeAudioDownloader.app

      - name: Upload to GitHub Release (macOS)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'dev-latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'Dev Build (Latest)' }}
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/') }}
          files: youtube_dl/dist/YoutubeAudioDownloader-macOS.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
